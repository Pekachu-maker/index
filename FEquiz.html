<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FE 成長率クイズ</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    padding:30px 15px;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#fdf4f4;
    color:#333;
}
.quiz{
    width:min(700px,100%);
    margin:0 auto;
    padding:30px;
    background:#fff;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}
h1{text-align:center;margin:0 0 20px;font-size:26px}
.question{text-align:center;font-size:18px;margin:20px 0}
.info-area{text-align:center;margin-bottom:20px}
.info-row{margin:8px 0;font-size:18px}
.info-label{color:#666}
.info-value{font-weight:bold}
.table-wrapper{width:100%;overflow-x:auto}
table{
    width:100%;
    min-width:560px;
    border-collapse:collapse;
    margin:20px 0;
}
th,td{
    border:1px solid #ddd;
    text-align:center;
    padding:12px 6px;
}
th{background:#f3f4f6;font-weight:bold}
td{font-size:20px;font-weight:bold}
.hint-area{text-align:center;margin:20px 0}
button{
    border:0;
    border-radius:8px;
    padding:12px 20px;
    background:#34d399;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{opacity:.85}
button:disabled{background:#aaa;cursor:default;opacity:1}
.hint-count{margin-top:8px;font-size:14px;color:#666}
.answer-area{display:flex;gap:10px;margin-top:20px}
input{
    flex:1;
    min-width:0;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
}
input:focus{border-color:#34d399}
.result{
    min-height:30px;
    margin:20px 0 10px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}
.next{display:block;margin:15px auto 0}
.score{
    margin-top:20px;
    text-align:center;
    color:#666;
    line-height:1.8;
}
.loading,.error{text-align:center;padding:30px}
.error{color:#d33;line-height:1.8}
@media(max-width:600px){
    .quiz{padding:20px 15px}
    th,td{padding:10px 3px}
    th{font-size:13px}
    td{font-size:17px}
    .answer-area{flex-direction:column}
    .answer-area button{width:100%}
}
</style>
</head>
<body>

<div class="quiz">
    <h1>FE 成長率クイズ</h1>

    <div id="loading" class="loading">データを読み込んでいます……</div>

    <div id="game" style="display:none">
        <div class="question">この成長率を持つキャラクターは誰？</div>

        <div class="info-area">
            <div class="info-row">
                <span class="info-label">登場作品：</span>
                <span id="gameName" class="info-value">？？？</span>
            </div>
            <div class="info-row">
                <span class="info-label">クラス：</span>
                <span id="className" class="info-value">？？？</span>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>HP</th>
                        <th>力</th>
                        <th>魔力</th>
                        <th>技</th>
                        <th>速さ</th>
                        <th>幸運</th>
                        <th>守備</th>
                        <th>魔防</th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="growthRow"></tr>
                </tbody>
            </table>
        </div>

        <div class="hint-area">
            <button id="hintButton" onclick="useHint()">ヒント</button>
            <div id="hintCount" class="hint-count">ヒント使用回数：0</div>
        </div>

        <div class="answer-area">
            <input id="answer" type="text" placeholder="キャラクター名を入力" autocomplete="off">
            <button id="answerButton" onclick="checkAnswer()">回答</button>
        </div>

        <div id="result" class="result"></div>

        <button id="nextButton" class="next" onclick="nextQuestion()" style="display:none">次の問題</button>

        <div id="score" class="score">
            正解：0 / 0<br>
            不正解：0
        </div>
    </div>

    <div id="error" class="error" style="display:none"></div>
</div>

<script>
let characters=[];
let currentCharacter=null;
let correctCount=0;
let wrongCount=0;
let questionCount=0;
let answered=false;
let hintCount=0;

async function loadCharacters(){
    try{
        const response=await fetch("characters.json");
        if(!response.ok)throw new Error("characters.jsonを読み込めませんでした。");
        const data=await response.json();
        if(!Array.isArray(data)||data.length===0)throw new Error("キャラクターデータがありません。");
        characters=data;
        document.getElementById("loading").style.display="none";
        document.getElementById("game").style.display="block";
        nextQuestion();
    }catch(error){
        console.error(error);
        document.getElementById("loading").style.display="none";
        const errorElement=document.getElementById("error");
        errorElement.style.display="block";
        errorElement.innerHTML="データを読み込めませんでした。<br>characters.jsonがindex.htmlと同じフォルダにあるか確認してください。";
    }
}

function nextQuestion(){
    answered=false;
    currentCharacter=characters[Math.floor(Math.random()*characters.length)];
    hintCount=0;

    document.getElementById("gameName").textContent="？？？";
    document.getElementById("className").textContent="？？？";

    const row=document.getElementById("growthRow");
    row.innerHTML="";

    currentCharacter.growth.forEach(value=>{
        const td=document.createElement("td");
        td.textContent=value+"%";
        row.appendChild(td);
    });

    document.getElementById("hintCount").textContent="ヒント使用回数：0";
    document.getElementById("hintButton").disabled=false;
    document.getElementById("answerButton").disabled=false;
    document.getElementById("nextButton").style.display="none";
    document.getElementById("result").textContent="";

    const answer=document.getElementById("answer");
    answer.value="";
    answer.focus();
}

function useHint(){
    if(answered||hintCount>=2)return;

    hintCount++;

    if(hintCount===1){
        document.getElementById("gameName").textContent=currentCharacter.game;
    }else if(hintCount===2){
        document.getElementById("className").textContent=currentCharacter.className;
        document.getElementById("hintButton").disabled=true;
    }

    document.getElementById("hintCount").textContent="ヒント使用回数："+hintCount;
}

function normalizeKana(text){
    return text
        .trim()
        .normalize("NFKC")
        .replace(/[\u30A1-\u30F6]/g,char=>
            String.fromCharCode(char.charCodeAt(0)-0x60)
        );
}

function checkAnswer(){
    if(answered)return;

    const input=document.getElementById("answer").value;
    if(input.trim()==="")return;

    answered=true;
    questionCount++;

    const normalizedInput=normalizeKana(input);
    const normalizedAnswer=normalizeKana(currentCharacter.name);
    const result=document.getElementById("result");

    if(normalizedInput===normalizedAnswer){
        correctCount++;
        result.textContent="○ 正解！ 「"+currentCharacter.name+"」";
    }else{
        wrongCount++;
        result.textContent="× 不正解！ 正解は「"+currentCharacter.name+"」";
    }

    document.getElementById("score").innerHTML=
        "正解："+correctCount+" / "+questionCount+
        "<br>不正解："+wrongCount;

    document.getElementById("hintButton").disabled=true;
    document.getElementById("answerButton").disabled=true;
    document.getElementById("nextButton").style.display="block";
}

document.getElementById("answer").addEventListener("keydown",event=>{
    if(event.key==="Enter")checkAnswer();
});

loadCharacters();
</script>

</body>
</html>
