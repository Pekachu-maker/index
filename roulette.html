<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルーレット抽選</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:sans-serif;
    background:#f3f4f6;
    width:100vw;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:95vw;
    max-width:700px;
    height:95vh;
    display:flex;
    gap:12px;
}

.left-panel{
    flex:1;
    background:white;
    padding:8px;
    border-radius:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    box-sizing:border-box;
}

.right-panel{
    width:190px;
    background:white;
    padding:8px;
    border-radius:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    overflow-y:auto;
    box-sizing:border-box;
}

h1{
    text-align:center;
}

h2{
    text-align:center;
}

textarea,
input{
    width:100%;
    box-sizing:border-box;
    margin-top:8px;
    margin-bottom:14px;
    padding:8px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:15px;
    line-height:1.2;

}

textarea{
    min-height:220px;
    resize:vertical;
}

button{
    width:100%;
    padding:8px;
    border:none;
    border-radius:12px;
    background:black;
    color:white;
    cursor:pointer;
    font-size:14px;
}

.results{
    margin-top:12px;
}

.result-item{
    height:40px;
    overflow:hidden;
    border-radius:12px;
    background:#111827;
    color:white;
    margin-top:10px;
}

.result-item.finished{
    background:#f1f5f9;
    color:black;
}

.reel{
    transform:translateY(0);
}

.reel-row{
    height:40px;
    line-height:40px;
    text-align:center;
    font-size:16px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="left-panel">

        <h1>ルーレット抽選サイト</h1>

        <label>候補を1行ずつ入力</label>

	<textarea id="list">
ゆ
る
す
ぎ</textarea>

        <label>抽選する数</label>

        <input
            type="number"
            id="count"
            value="4"
            min="1"
            font-size="150"
        >

        <button id="drawButton">
            抽選スタート
        </button>


    </div>

    <div class="right-panel">

        <h2>抽選結果</h2>

        <div
            class="results"
            id="results"
        ></div>

    </div>

</div>

<script>

const drawButton =
    document.getElementById("drawButton");

const resultsDiv =
    document.getElementById("results");

let isDrawing = false;

function shuffle(array){

    const copied = [...array];

    for(
        let i = copied.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [copied[i], copied[j]] =
            [copied[j], copied[i]];
    }

    return copied;
}

drawButton.addEventListener(
    "click",
    async () => {

        if(isDrawing){
            return;
        }

        isDrawing = true;

        drawButton.disabled = true;

        drawButton.textContent =
            "抽選中...";

        let items =
            document
            .getElementById("list")
            .value
            .split(/\r?\n/)
            .map(v => v.trim())
            .filter(v => v !== "");

        const count =
            Number(
                document
                .getElementById("count")
                .value
            );

        if(items.length === 0){

            alert(
                "候補を入力してください"
            );

            resetButton();
            return;
        }

        if(count < 1){

            alert(
                "抽選数は1以上にしてください"
            );
            resetButton();
            return;
        }
        if(count > items.length){
            alert(
                "抽選数が候補数を超えています"
            );
            resetButton();
            return;
        }
        resultsDiv.innerHTML = "";
        for(
            let i = 0;
            i < count;
            i++
        ){

            const slot =
                document.createElement(
                    "div"
                );

            slot.className =
                "result-item";

            slot.id =
                `slot-${i}`;

            slot.innerHTML =
                '<div class="reel"></div>';

            resultsDiv.appendChild(
                slot
            );
        }

        for(
            let i = 0;
            i < count;
            i++
        ){

            const winner =
                shuffle(items)[0];

            const slot =
                document.getElementById(
                    `slot-${i}`
                );
            await spinSlot(
                slot,
                items,
                winner
            );
            items =
                items.filter(
                    item =>
                    item !== winner
                );
        }
        resetButton();
    }
);

function spinSlot(
    slot,
    items,
    winner
){

    return new Promise(
        resolve => {

            const reel =
                slot.querySelector(
                    ".reel"
                );

            const rows = [];

            for(
                let i = 0;
                i < 50;
                i++
            ){

                rows.push(
                    items[
                        Math.floor(
                            Math.random()
                            * items.length
                        )
                    ]
                );
            }

            rows.push(winner);

            reel.innerHTML =
                rows
                .map(
                    item =>
                    `<div class="reel-row">${item}</div>`
                )
                .join("");

            reel.style.transition =
                "none";

            reel.style.transform =
                "translateY(0px)";

            requestAnimationFrame(
                () => {
                requestAnimationFrame(
                    () => {
                    reel.style.transition =
                        "transform 6s cubic-bezier(.12,.82,.22,1)";

                    reel.style.transform =
                        `translateY(-${
                            40 *
                            (
                                rows.length
                                - 1
                            )
                        }px)`;
                });
            });
            setTimeout(
                () => {
                slot.classList.add(
                    "finished"
                );
                resolve();
            },6000);
        }
    );
}

function resetButton(){

    drawButton.disabled =
        false;

    drawButton.textContent =
        "抽選スタート";

    isDrawing = false;
}

</script>

</body>
</html>
