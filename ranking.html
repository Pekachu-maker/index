<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>キャラクターランキング</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      background: linear-gradient(135deg, #f5f7ff, #eef1f7);
      color: #1f2937;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .app {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 32px 18px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 800;
      color: #111827;
      letter-spacing: .03em;
    }

    .header p {
      margin: 9px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .panel {
      background: rgba(255,255,255,.97);
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(15,23,42,.08);
    }

    .setup {
      padding: 28px;
    }

    .section-title {
      margin: 0 0 7px;
      font-size: 20px;
      font-weight: 800;
      color: #111827;
    }

    .section-description {
      margin: 0 0 20px;
      color: #6b7280;
      font-size: 14px;
    }

    .game-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .small-button {
      padding: 8px 15px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #fff;
      color: #4b5563;
      transition: .18s;
    }

    .small-button:hover {
      background: #f3f4f6;
    }

    .game-list {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 10px;
    }

    .game-item {
      position: relative;
    }

    .game-item input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .game-label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #f8fafc;
      cursor: pointer;
      transition: .18s;
    }

    .game-label:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .game-item input:checked + .game-label {
      background: #eef2ff;
      border-color: #818cf8;
      box-shadow: 0 4px 12px rgba(99,102,241,.12);
    }

    .check {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      border: 2px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      position: relative;
    }

    .game-item input:checked + .game-label .check {
      background: #6366f1;
      border-color: #6366f1;
    }

    .game-item input:checked + .game-label .check::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 10px;
      left: 5px;
      top: 2px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .game-name {
      font-size: 14px;
      font-weight: 700;
    }

    .mode-section {
      margin-top: 30px;
    }

    .mode-list {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 12px;
    }

    .mode-item {
      position: relative;
    }

    .mode-item input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mode-label {
      display: block;
      height: 100%;
      padding: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 17px;
      background: #f8fafc;
      cursor: pointer;
      transition: .18s;
    }

    .mode-label:hover {
      background: #f1f5f9;
    }

    .mode-item input:checked + .mode-label {
      border-color: #818cf8;
      background: #eef2ff;
      box-shadow: 0 5px 15px rgba(99,102,241,.12);
    }

    .mode-name {
      display: block;
      margin-bottom: 7px;
      font-weight: 800;
      color: #111827;
    }

    .mode-description {
      display: block;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }

    .selection-info {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 24px 0 12px;
    }

    .info-card {
      width: 210px;
      padding: 14px;
      text-align: center;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
    }

    .info-label {
      display: block;
      color: #6b7280;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 24px;
      font-weight: 800;
      color: #111827;
    }

    .match-count {
      min-height: 20px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .start-button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg,#6366f1,#4f46e5);
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      box-shadow: 0 8px 18px rgba(79,70,229,.25);
      transition: .18s;
    }

    .start-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(79,70,229,.3);
    }

    .start-button:disabled {
      opacity: .45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .error {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 14px;
    }

    .compare {
      padding: 24px;
    }

    .compare-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .compare-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
    }

    .progress {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
    }

    .battle {
      display: grid;
      grid-template-columns: minmax(0,1fr) 80px minmax(0,1fr);
      align-items: center;
      gap: 15px;
    }

    .character-button {
      width: 100%;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(15,23,42,.06);
      transition: .2s;
    }

    .character-button:hover {
      transform: translateY(-4px);
      border-color: #818cf8;
      box-shadow: 0 14px 28px rgba(79,70,229,.14);
    }

    .character-image {
      display: block;
      width: 100%;
      height: 330px;
      object-fit: contain;
      background: #f8fafc;
      border-radius: 16px;
      margin-bottom: 14px;
    }

    .character-name {
      font-size: 20px;
      font-weight: 800;
      color: #111827;
    }

    .vs {
      width: 70px;
      height: 70px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #111827;
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(15,23,42,.2);
    }

    .compare-footer {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .back-button {
      padding: 9px 16px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #fff;
      color: #6b7280;
      font-size: 13px;
    }

    .result {
      padding: 28px;
    }

    .result-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .result-title {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .result-subtitle {
      margin: 7px 0 0;
      color: #9ca3af;
      font-size: 13px;
    }

    .top-ranking {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 14px;
      align-items: end;
    }

    .rank-card {
      padding: 14px;
      text-align: center;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(15,23,42,.06);
    }

    .rank-card.first {
      transform: translateY(-14px);
      border-color: #fbbf24;
      box-shadow: 0 12px 26px rgba(245,158,11,.14);
    }

    .rank-number {
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 900;
    }

    .rank-image {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #f8fafc;
      border-radius: 15px;
      margin-bottom: 12px;
    }

    .rank-name {
      font-size: 18px;
      font-weight: 900;
      color: #111827;
    }

    .rank-score {
      margin-top: 8px;
      color: #4f46e5;
      font-size: 14px;
      font-weight: 800;
    }

    .lower-ranking {
      margin-top: 24px;
    }

    .lower-toggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 18px;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      background: #f8fafc;
      color: #374151;
      font-weight: 800;
    }

    .arrow {
      transition: transform .2s;
    }

    .lower-ranking.open .arrow {
      transform: rotate(180deg);
    }

    .lower-list {
      display: none;
      margin-top: 10px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      background: #fff;
    }

    .lower-ranking.open .lower-list {
      display: block;
    }

    .lower-item {
      display: grid;
      grid-template-columns: 55px 56px minmax(0,1fr) 80px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid #f1f5f9;
    }

    .lower-item:last-child {
      border-bottom: 0;
    }

    .lower-rank {
      text-align: center;
      color: #6b7280;
      font-weight: 900;
    }

    .lower-image {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 10px;
      background: #f8fafc;
    }

    .lower-name {
      font-weight: 800;
    }

    .lower-score {
      text-align: right;
      color: #4f46e5;
      font-weight: 800;
    }

    .result-actions {
      display: flex;
      justify-content: center;
      margin-top: 26px;
    }

    .restart-button {
      padding: 12px 24px;
      border: 0;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      font-weight: 800;
    }

    .loading {
      padding: 70px 20px;
      text-align: center;
      color: #6b7280;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 14px;
      border: 4px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width:700px) {
      .app {
        padding: 18px 12px 40px;
      }

      .setup,
      .compare,
      .result {
        padding: 18px;
        border-radius: 20px;
      }

      .game-list {
        grid-template-columns: repeat(2,1fr);
      }

      .mode-list {
        grid-template-columns: 1fr;
      }

      .battle {
        grid-template-columns: 1fr;
      }

      .vs {
        width: 52px;
        height: 52px;
        font-size: 14px;
      }

      .character-image {
        height: 280px;
      }

      .top-ranking {
        grid-template-columns: 1fr 1fr;
      }

      .rank-card.first {
        grid-column: 1 / -1;
        transform: none;
        max-width: 330px;
        width: 100%;
        margin: 0 auto;
      }

      .rank-card.first .rank-image {
        height: 260px;
      }
    }

    @media (max-width:430px) {
      .game-list {
        grid-template-columns: 1fr;
      }

      .top-ranking {
        grid-template-columns: 1fr;
      }

      .rank-card.first {
        grid-column: auto;
      }

      .lower-item {
        grid-template-columns: 40px 48px minmax(0,1fr);
      }

      .lower-score {
        display: none;
      }

      .lower-image {
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>キャラクターランキング</h1>
      <p>高精度スコア型・間接比較ランキング</p>
    </header>

    <section id="loadingArea" class="panel">
      <div class="loading">
        <div class="spinner"></div>
        <div>キャラクターデータを読み込んでいます……</div>
      </div>
    </section>

    <section id="setupArea" class="panel setup hidden">
      <h2 class="section-title">登場作品を選択</h2>
      <p class="section-description">ランキングに参加させたい作品を選択してください。</p>

      <div class="game-actions">
        <button id="selectAllBtn" class="small-button">全選択</button>
        <button id="clearAllBtn" class="small-button">全解除</button>
      </div>

      <div id="gameList" class="game-list"></div>

      <div class="mode-section">
        <h2 class="section-title">比較方式</h2>
        <p class="section-description">ランキングの作成方法を選択してください。</p>

        <div class="mode-list">
          <div class="mode-item">
            <input type="radio" id="modeIndirect" name="compareMode" value="indirect" checked>
            <label for="modeIndirect" class="mode-label">
              <span class="mode-name">間接比較モード</span>
              <span class="mode-description">少ない直接比較から勝敗関係を推定し、スコアが近いキャラを重点的に比較します。</span>
            </label>
          </div>

          <div class="mode-item">
            <input type="radio" id="modeRoundRobin" name="compareMode" value="roundrobin">
            <label for="modeRoundRobin" class="mode-label">
              <span class="mode-name">総当たりモード</span>
              <span class="mode-description">すべてのキャラ同士を1回ずつ直接比較します。</span>
            </label>
          </div>
        </div>
      </div>

      <div class="selection-info">
        <div class="info-card">
          <span class="info-label">選択作品</span>
          <span id="selectedGameCount" class="info-value">0</span>
        </div>
        <div class="info-card">
          <span class="info-label">対象キャラ</span>
          <span id="selectedCharacterCount" class="info-value">0</span>
        </div>
      </div>

      <div id="matchCount" class="match-count"></div>

      <button id="startButton" class="start-button" disabled>ランキング開始</button>
      <div id="setupError" class="error hidden"></div>
    </section>

    <section id="compareArea" class="panel compare hidden">
      <div class="compare-header">
        <h2 class="compare-title">どちらが好き？</h2>
        <div id="progress" class="progress"></div>
      </div>

      <div class="battle">
        <button id="leftBtn" class="character-button">
          <img id="leftImg" class="character-image" alt="">
          <div id="leftName" class="character-name"></div>
        </button>

        <div class="vs">VS</div>

        <button id="rightBtn" class="character-button">
          <img id="rightImg" class="character-image" alt="">
          <div id="rightName" class="character-name"></div>
        </button>
      </div>

      <div class="compare-footer">
        <button id="changeSelectionBtn" class="back-button">選択画面に戻る</button>
      </div>
    </section>

    <section id="resultArea" class="panel result hidden">
      <div class="result-header">
        <h2 class="result-title">RANKING</h2>
        <p id="resultSubtitle" class="result-subtitle"></p>
      </div>

      <div id="topRanking" class="top-ranking"></div>

      <div id="lowerRanking" class="lower-ranking">
        <button id="lowerToggle" class="lower-toggle">
          <span>6位以降のランキングを表示</span>
          <span class="arrow">▼</span>
        </button>
        <div id="lowerList" class="lower-list"></div>
      </div>

      <div class="result-actions">
        <button id="restartButton" class="restart-button">もう一度遊ぶ</button>
      </div>
    </section>
  </div>

  <script>
    "use strict";

    const JSON_FILE = "rankingCharacters.json";
    const IMAGE_FOLDER = "FEimages/";
    const K = 32;

    /*
      間接比較の設定

      INITIAL_MATCHES:
      最初に1キャラあたり何回程度直接比較するか。

      CLOSE_SCORE:
      スコア差がこの数値以下なら追加比較候補にする。

      MAX_EXTRA_ROUNDS:
      スコアが近いキャラを追加で比較する回数。
    */
    const INITIAL_MATCHES = 3;
    const CLOSE_SCORE = 80;
    const MAX_EXTRA_ROUNDS = 2;

    let gameData = {};
    let charData = [];
    let score = {};
    let directWins = {};
    let directLosses = {};
    let directMatches = new Set();
    let currentRound = 0;
    let initialTarget = 0;
    let extraRoundLimit = 0;
    let compareMode = "indirect";

    const loadingArea = document.getElementById("loadingArea");
    const setupArea = document.getElementById("setupArea");
    const compareArea = document.getElementById("compareArea");
    const resultArea = document.getElementById("resultArea");

    const gameList = document.getElementById("gameList");
    const selectedGameCount = document.getElementById("selectedGameCount");
    const selectedCharacterCount = document.getElementById("selectedCharacterCount");
    const matchCount = document.getElementById("matchCount");
    const startButton = document.getElementById("startButton");
    const setupError = document.getElementById("setupError");

    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const leftImg = document.getElementById("leftImg");
    const rightImg = document.getElementById("rightImg");
    const leftName = document.getElementById("leftName");
    const rightName = document.getElementById("rightName");
    const progress = document.getElementById("progress");

    const topRanking = document.getElementById("topRanking");
    const lowerRanking = document.getElementById("lowerRanking");
    const lowerToggle = document.getElementById("lowerToggle");
    const lowerList = document.getElementById("lowerList");
    const resultSubtitle = document.getElementById("resultSubtitle");

    loadJSON();

    async function loadJSON() {
      try {
        const response = await fetch(JSON_FILE);

        if (!response.ok) {
          throw new Error();
        }

        gameData = await response.json();

        validateJSON();
        createGameList();

        loadingArea.classList.add("hidden");
        setupArea.classList.remove("hidden");

        updateSelectionInfo();
      } catch (error) {
        loadingArea.classList.add("hidden");
        setupArea.classList.remove("hidden");
        showError("rankingCharacters.jsonを読み込めませんでした。JSONの構文とファイルの場所を確認してください。");
      }
    }

    function validateJSON() {
      if (
        typeof gameData !== "object" ||
        gameData === null ||
        Array.isArray(gameData)
      ) {
        throw new Error();
      }

      for (const [game, characters] of Object.entries(gameData)) {
        if (!Array.isArray(characters)) {
          throw new Error();
        }

        for (const name of characters) {
          if (typeof name !== "string" || !name.trim()) {
            throw new Error();
          }
        }
      }
    }

    function createGameList() {
      gameList.innerHTML = "";

      Object.keys(gameData).forEach((game,index) => {
        const item = document.createElement("div");
        item.className = "game-item";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.id = `game-${index}`;
        input.value = game;

        input.addEventListener("change", updateSelectionInfo);

        const label = document.createElement("label");
        label.className = "game-label";
        label.htmlFor = input.id;

        const check = document.createElement("span");
        check.className = "check";

        const name = document.createElement("span");
        name.className = "game-name";
        name.textContent = game;

        label.appendChild(check);
        label.appendChild(name);
        item.appendChild(input);
        item.appendChild(label);

        gameList.appendChild(item);
      });
    }

    function getSelectedGames() {
      return [...gameList.querySelectorAll("input:checked")]
        .map(input => input.value);
    }

    /*
      作品をまたいで同じ名前があった場合、
      Mapによって1キャラに統合する。
    */
    function getSelectedCharacters() {
      const selectedGames = getSelectedGames();
      const characters = new Map();

      selectedGames.forEach(game => {
        gameData[game].forEach(name => {
          const characterName = name.trim();

          if (!characters.has(characterName)) {
            characters.set(characterName,{
              id: characterName,
              name: characterName,
              img: IMAGE_FOLDER + characterName + ".png"
            });
          }
        });
      });

      return [...characters.values()];
    }

    function updateSelectionInfo() {
      const games = getSelectedGames();
      const characters = getSelectedCharacters();

      selectedGameCount.textContent = games.length;
      selectedCharacterCount.textContent = characters.length;

      const mode = document.querySelector(
        'input[name="compareMode"]:checked'
      )?.value || "indirect";

      compareMode = mode;

      if (characters.length < 2) {
        matchCount.textContent = "";
        startButton.disabled = true;
        return;
      }

      startButton.disabled = false;

      if (mode === "roundrobin") {
        const matches =
          characters.length * (characters.length - 1) / 2;

        matchCount.textContent =
          `総当たり：全${matches}試合`;
      } else {
        const basic =
          Math.ceil(characters.length * INITIAL_MATCHES / 2);

        matchCount.textContent =
          `間接比較：約${basic}試合から開始。スコアが近い場合は追加比較します。`;
      }
    }

    document.querySelectorAll(
      'input[name="compareMode"]'
    ).forEach(input => {
      input.addEventListener("change",updateSelectionInfo);
    });

    document.getElementById("selectAllBtn").addEventListener("click",() => {
      gameList.querySelectorAll("input").forEach(input => {
        input.checked = true;
      });

      updateSelectionInfo();
    });

    document.getElementById("clearAllBtn").addEventListener("click",() => {
      gameList.querySelectorAll("input").forEach(input => {
        input.checked = false;
      });

      updateSelectionInfo();
    });

    startButton.addEventListener("click",startRanking);

    function startRanking() {
      charData = getSelectedCharacters();

      if (charData.length < 2) {
        showError("2人以上のキャラクターを選択してください。");
        return;
      }

      compareMode =
        document.querySelector(
          'input[name="compareMode"]:checked'
        ).value;

      initializeRanking();

      setupArea.classList.add("hidden");
      resultArea.classList.add("hidden");
      compareArea.classList.remove("hidden");

      nextMatch();
    }

    function initializeRanking() {
      score = {};
      directWins = {};
      directLosses = {};
      directMatches = new Set();
      currentRound = 0;

      charData.forEach(character => {
        score[character.id] = 1000;
        directWins[character.id] = [];
        directLosses[character.id] = [];
      });

      initialTarget = Math.max(
        charData.length,
        Math.ceil(
          charData.length * INITIAL_MATCHES / 2
        )
      );

      extraRoundLimit =
        initialTarget +
        charData.length * MAX_EXTRA_ROUNDS;
    }

    function pairKey(a,b) {
      return [a,b].sort().join("\u0000");
    }

    function alreadyCompared(a,b) {
      return directMatches.has(pairKey(a,b));
    }

    /*
      直接勝敗だけをスコアに反映する。
      ここが重要で、間接勝利を直接勝利として
      Elo計算に二重反映しない。
    */
    function registerDirectWin(winner,loser) {
      const expected =
        1 / (
          1 +
          10 ** (
            (score[loser] - score[winner]) / 400
          )
        );

      score[winner] += K * (1 - expected);
      score[loser] += K * (0 - expected);

      directWins[winner].push(loser);
      directLosses[loser].push(winner);

      directMatches.add(pairKey(winner,loser));
    }

    /*
      A > B
      B > C
      ↓
      A > C

      ただし、これは「推定」であり、
      AとCを直接比較したことにはしない。
    */
    function canInferWinner(a,b) {
      return reaches(a,b);
    }

    function reaches(start,target) {
      const visited = new Set([start]);
      const queue = [start];

      while (queue.length > 0) {
        const current = queue.shift();

        for (const next of directWins[current]) {
          if (next === target) {
            return true;
          }

          if (!visited.has(next)) {
            visited.add(next);
            queue.push(next);
          }
        }
      }

      return false;
    }

    /*
      間接比較用の候補選択。

      優先順位：
      1. まだ比較したことがない
      2. スコアが近い
      3. まだ比較回数が少ないキャラを優先
    */
    function chooseIndirectPair() {
      const candidates = [];

      const matchCount = {};

      charData.forEach(character => {
        matchCount[character.id] = 0;
      });

      directMatches.forEach(key => {
        const [a,b] = key.split("\u0000");

        if (matchCount[a] !== undefined) {
          matchCount[a]++;
        }

        if (matchCount[b] !== undefined) {
          matchCount[b]++;
        }
      });

      for (let i = 0; i < charData.length; i++) {
        for (let j = i + 1; j < charData.length; j++) {
          const a = charData[i];
          const b = charData[j];

          if (alreadyCompared(a.id,b.id)) {
            continue;
          }

          const difference =
            Math.abs(score[a.id] - score[b.id]);

          const inferred =
            canInferWinner(a.id,b.id) ||
            canInferWinner(b.id,a.id);

          candidates.push({
            a,
            b,
            difference,
            inferred,
            count:
              matchCount[a.id] +
              matchCount[b.id]
          });
        }
      }

      if (candidates.length === 0) {
        return null;
      }

      /*
        初期段階では比較回数を均等化する。
      */
      if (currentRound < initialTarget) {
        const minCount =
          Math.min(
            ...charData.map(c => matchCount[c.id])
          );

        const balanced =
          candidates.filter(pair =>
            matchCount[pair.a.id] === minCount ||
            matchCount[pair.b.id] === minCount
          );

        if (balanced.length > 0) {
          return randomFrom(
            balanced.sort(
              (a,b) =>
                a.difference - b.difference
            ).slice(0,10)
          );
        }
      }

      /*
        初期比較後は、
        スコア差が小さい組み合わせを優先。
      */
      candidates.sort((a,b) => {
        const scoreA =
          a.difference +
          a.count * 8 +
          (a.inferred ? 25 : 0);

        const scoreB =
          b.difference +
          b.count * 8 +
          (b.inferred ? 25 : 0);

        return scoreA - scoreB;
      });

      return randomFrom(
        candidates.slice(
          0,
          Math.min(10,candidates.length)
        )
      );
    }

    function chooseRoundRobinPair() {
      const candidates = [];

      for (let i = 0; i < charData.length; i++) {
        for (let j = i + 1; j < charData.length; j++) {
          const a = charData[i];
          const b = charData[j];

          if (!alreadyCompared(a.id,b.id)) {
            candidates.push([a,b]);
          }
        }
      }

      if (candidates.length === 0) {
        return null;
      }

      return randomFrom(candidates);
    }

    function randomFrom(array) {
      return array[
        Math.floor(Math.random() * array.length)
      ];
    }

    function nextMatch() {
      let pair;

      if (compareMode === "roundrobin") {
        pair = chooseRoundRobinPair();
      } else {
        pair = chooseIndirectPair();
      }

      if (!pair) {
        finish();
        return;
      }

      const a = pair.a || pair[0];
      const b = pair.b || pair[1];

      leftName.textContent = a.name;
      rightName.textContent = b.name;

      setImage(leftImg,a);
      setImage(rightImg,b);

      leftBtn.onclick = () =>
        vote(a.id,b.id);

      rightBtn.onclick = () =>
        vote(b.id,a.id);

      if (compareMode === "roundrobin") {
        const total =
          charData.length *
          (charData.length - 1) / 2;

        progress.textContent =
          `${currentRound + 1} / ${total}`;
      } else {
        progress.textContent =
          `${currentRound + 1}試合`;
      }
    }

    function vote(winner,loser) {
      /*
        同じ組み合わせを二重処理しない。
      */
      if (alreadyCompared(winner,loser)) {
        return;
      }

      registerDirectWin(winner,loser);
      currentRound++;

      if (compareMode === "roundrobin") {
        if (currentRound >=
          charData.length *
          (charData.length - 1) / 2
        ) {
          finish();
          return;
        }

        nextMatch();
        return;
      }

      if (shouldFinishIndirect()) {
        finish();
        return;
      }

      nextMatch();
    }

    function shouldFinishIndirect() {
      /*
        全組み合わせが終わっていれば終了。
      */
      let remaining = 0;

      for (let i = 0; i < charData.length; i++) {
        for (let j = i + 1; j < charData.length; j++) {
          if (
            !alreadyCompared(
              charData[i].id,
              charData[j].id
            )
          ) {
            remaining++;
          }
        }
      }

      if (remaining === 0) {
        return true;
      }

      /*
        最低限の初期比較が終わるまでは継続。
      */
      if (currentRound < initialTarget) {
        return false;
      }

      /*
        スコアが近い未比較ペアがある場合、
        追加比較する。
      */
      let closePairs = 0;

      for (let i = 0; i < charData.length; i++) {
        for (let j = i + 1; j < charData.length; j++) {
          const a = charData[i];
          const b = charData[j];

          if (alreadyCompared(a.id,b.id)) {
            continue;
          }

          const difference =
            Math.abs(score[a.id] - score[b.id]);

          if (difference <= CLOSE_SCORE) {
            closePairs++;
          }
        }
      }

      /*
        追加比較上限に到達したら終了。
      */
      if (currentRound >= extraRoundLimit) {
        return true;
      }

      /*
        近いキャラがもういなければ終了。
      */
      if (closePairs === 0) {
        return true;
      }

      return false;
    }

    function finish() {
      compareArea.classList.add("hidden");
      resultArea.classList.remove("hidden");

      const ranking =
        charData
          .map(character => ({
            id: character.id,
            name: character.name,
            img: character.img,
            score: score[character.id]
          }))
          .sort((a,b) => b.score - a.score);

      resultSubtitle.textContent =
        `${charData.length}キャラ・${currentRound}試合`;

      renderTop(ranking.slice(0,5));
      renderLower(ranking.slice(5));

      lowerRanking.classList.remove("open");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function renderTop(ranking) {
      topRanking.innerHTML = "";

      ranking.forEach((character,index) => {
        const card =
          document.createElement("div");

        card.className = "rank-card";

        if (index === 0) {
          card.classList.add("first");
        }

        const rank =
          document.createElement("div");

        rank.className = "rank-number";

        if (index === 0) {
          rank.textContent = "🥇 1位";
        } else if (index === 1) {
          rank.textContent = "🥈 2位";
        } else if (index === 2) {
          rank.textContent = "🥉 3位";
        } else {
          rank.textContent = `${index + 1}位`;
        }

        const img =
          document.createElement("img");

        img.className = "rank-image";
        img.alt = character.name;

        setImage(img,character);

        const name =
          document.createElement("div");

        name.className = "rank-name";
        name.textContent = character.name;

        const scoreElement =
          document.createElement("div");

        scoreElement.className = "rank-score";
        scoreElement.textContent =
          `スコア ${character.score.toFixed(0)}`;

        card.appendChild(rank);
        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(scoreElement);

        topRanking.appendChild(card);
      });
    }

    function renderLower(ranking) {
      lowerList.innerHTML = "";

      if (ranking.length === 0) {
        lowerRanking.classList.add("hidden");
        return;
      }

      lowerRanking.classList.remove("hidden");

      ranking.forEach((character,index) => {
        const item =
          document.createElement("div");

        item.className = "lower-item";

        const rank =
          document.createElement("div");

        rank.className = "lower-rank";
        rank.textContent = `${index + 6}位`;

        const img =
          document.createElement("img");

        img.className = "lower-image";
        img.alt = character.name;

        setImage(img,character);

        const name =
          document.createElement("div");

        name.className = "lower-name";
        name.textContent = character.name;

        const scoreElement =
          document.createElement("div");

        scoreElement.className = "lower-score";
        scoreElement.textContent =
          character.score.toFixed(0);

        item.appendChild(rank);
        item.appendChild(img);
        item.appendChild(name);
        item.appendChild(scoreElement);

        lowerList.appendChild(item);
      });
    }

    function setImage(img,character) {
      img.src = character.img;

      img.onerror = () => {
        img.onerror = null;
        img.src = createPlaceholder(character.name);
      };
    }

    function createPlaceholder(name) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="400" height="500">
          <rect width="400" height="500" fill="#f8fafc"/>
          <text x="200" y="240" text-anchor="middle" font-size="28" fill="#9ca3af" font-family="sans-serif">${escapeHTML(name)}</text>
          <text x="200" y="280" text-anchor="middle" font-size="16" fill="#cbd5e1" font-family="sans-serif">画像なし</text>
        </svg>
      `;

      return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);
    }

    function escapeHTML(text) {
      return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function showError(message) {
      setupError.textContent = message;
      setupError.classList.remove("hidden");
    }

    lowerToggle.addEventListener("click",() => {
      lowerRanking.classList.toggle("open");
    });

    document.getElementById(
      "changeSelectionBtn"
    ).addEventListener("click",() => {
      compareArea.classList.add("hidden");
      setupArea.classList.remove("hidden");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    document.getElementById(
      "restartButton"
    ).addEventListener("click",() => {
      resultArea.classList.add("hidden");
      setupArea.classList.remove("hidden");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
</body>
</html>
