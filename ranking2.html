<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>キャラクターランキング</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      background: radial-gradient(circle at top, #f5f7ff 0%, #eef1f7 45%, #e8ebf2 100%);
      color: #1f2937;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .app {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 32px 18px 60px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-title {
      margin: 0;
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #111827;
    }

    .header-subtitle {
      margin: 10px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .setup-panel {
      padding: 28px;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
      color: #111827;
    }

    .section-description {
      margin: 0 0 22px;
      color: #6b7280;
      font-size: 14px;
    }

    .game-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .small-button {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #4b5563;
      padding: 8px 14px;
      border-radius: 999px;
      transition: 0.18s;
    }

    .small-button:hover {
      background: #f3f4f6;
      border-color: #9ca3af;
    }

    .game-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .game-item {
      position: relative;
    }

    .game-item input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .game-label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      cursor: pointer;
      user-select: none;
      transition: 0.18s;
    }

    .game-label:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .game-item input:checked + .game-label {
      background: #eef2ff;
      border-color: #818cf8;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.12);
    }

    .custom-check {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      border-radius: 7px;
      border: 2px solid #cbd5e1;
      background: #fff;
      position: relative;
    }

    .game-item input:checked + .game-label .custom-check {
      background: #6366f1;
      border-color: #6366f1;
    }

    .game-item input:checked + .game-label .custom-check::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 10px;
      left: 5px;
      top: 2px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    .game-name {
      font-weight: 700;
      font-size: 14px;
    }

    .mode-section {
      margin-top: 30px;
    }

    .mode-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .mode-item {
      position: relative;
    }

    .mode-item input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mode-label {
      display: block;
      height: 100%;
      padding: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 17px;
      background: #f8fafc;
      cursor: pointer;
      transition: 0.18s;
    }

    .mode-label:hover {
      border-color: #cbd5e1;
      background: #f1f5f9;
    }

    .mode-item input:checked + .mode-label {
      border-color: #818cf8;
      background: #eef2ff;
      box-shadow: 0 5px 15px rgba(99, 102, 241, 0.12);
    }

    .mode-name {
      display: block;
      margin-bottom: 7px;
      font-weight: 800;
      color: #111827;
    }

    .mode-description {
      display: block;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }

    .selection-info {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 24px 0;
    }

    .info-card {
      flex: 1;
      max-width: 220px;
      padding: 15px;
      text-align: center;
      background: #f8fafc;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
    }

    .info-label {
      display: block;
      color: #6b7280;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 24px;
      font-weight: 800;
      color: #111827;
    }

    .match-count {
      margin: -8px 0 20px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    .start-button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.25);
      transition: 0.18s;
    }

    .start-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(79, 70, 229, 0.3);
    }

    .start-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .error-message {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 14px;
    }

    .compare-panel {
      padding: 24px;
    }

    .compare-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .compare-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .progress {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
    }

    .battle-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 90px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
    }

    .character-button {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 14px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      transition: 0.2s;
    }

    .character-button:hover {
      transform: translateY(-4px);
      border-color: #818cf8;
      box-shadow: 0 14px 28px rgba(79, 70, 229, 0.14);
      background: #fafaff;
    }

    .character-button:active {
      transform: translateY(-1px) scale(0.99);
    }

    .character-image {
      display: block;
      width: 100%;
      height: 330px;
      object-fit: contain;
      border-radius: 16px;
      background: #f8fafc;
      margin-bottom: 14px;
    }

    .character-name {
      font-size: 20px;
      font-weight: 800;
      color: #111827;
    }

    .vs {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 74px;
      height: 74px;
      margin: auto;
      border-radius: 50%;
      background: #111827;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.2);
    }

    .compare-footer {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .back-button {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #6b7280;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
    }

    .back-button:hover {
      background: #f9fafb;
    }

    .result-panel {
      padding: 28px;
    }

    .result-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .result-title {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .result-subtitle {
      margin: 7px 0 0;
      color: #9ca3af;
      font-size: 13px;
    }

    .top-ranking {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: end;
    }

    .rank-card {
      position: relative;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    }

    .rank-card.first {
      transform: translateY(-14px);
      border-color: #fbbf24;
      box-shadow: 0 12px 26px rgba(245, 158, 11, 0.14);
    }

    .rank-number {
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 9px;
    }

    .rank-card.first .rank-number {
      color: #d97706;
    }

    .rank-card.second .rank-number {
      color: #64748b;
    }

    .rank-card.third .rank-number {
      color: #a16207;
    }

    .rank-image {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #f8fafc;
      border-radius: 15px;
      margin-bottom: 12px;
    }

    .rank-name {
      font-size: 18px;
      font-weight: 900;
      color: #111827;
    }

    .rank-score {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 800;
      color: #4f46e5;
    }

    .lower-ranking {
      margin-top: 24px;
    }

    .lower-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 15px 18px;
      background: #f8fafc;
      color: #374151;
      font-weight: 800;
      transition: 0.18s;
    }

    .lower-toggle:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .arrow {
      transition: transform 0.2s;
    }

    .lower-ranking.open .arrow {
      transform: rotate(180deg);
    }

    .lower-list {
      display: none;
      margin-top: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      overflow: hidden;
      background: #fff;
    }

    .lower-ranking.open .lower-list {
      display: block;
    }

    .lower-item {
      display: grid;
      grid-template-columns: 55px 56px minmax(0, 1fr) 80px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid #f1f5f9;
    }

    .lower-item:last-child {
      border-bottom: 0;
    }

    .lower-rank {
      text-align: center;
      color: #6b7280;
      font-weight: 900;
    }

    .lower-image {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 10px;
      background: #f8fafc;
    }

    .lower-name {
      font-weight: 800;
      color: #374151;
    }

    .lower-score {
      text-align: right;
      color: #4f46e5;
      font-weight: 800;
    }

    .result-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 26px;
    }

    .restart-button {
      border: 0;
      border-radius: 999px;
      padding: 12px 24px;
      background: #111827;
      color: #fff;
      font-weight: 800;
      transition: 0.18s;
    }

    .restart-button:hover {
      transform: translateY(-2px);
      background: #1f2937;
    }

    .loading {
      text-align: center;
      padding: 70px 20px;
      color: #6b7280;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 14px;
      border: 4px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {
      .app {
        padding: 18px 12px 40px;
      }

      .setup-panel,
      .compare-panel,
      .result-panel {
        padding: 18px;
        border-radius: 20px;
      }

      .game-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mode-list {
        grid-template-columns: 1fr;
      }

      .battle-area {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .vs {
        width: 52px;
        height: 52px;
        font-size: 14px;
      }

      .character-image {
        height: 280px;
      }

      .top-ranking {
        grid-template-columns: 1fr 1fr;
      }

      .rank-card.first {
        grid-column: 1 / -1;
        transform: none;
        max-width: 330px;
        width: 100%;
        margin: 0 auto;
      }

      .rank-card.first .rank-image {
        height: 260px;
      }

      .rank-image {
        height: 190px;
      }

      .lower-item {
        grid-template-columns: 42px 56px minmax(0, 1fr) 70px;
        gap: 8px;
        padding: 9px;
      }
    }

    @media (max-width: 430px) {
      .game-list {
        grid-template-columns: 1fr;
      }

      .selection-info {
        gap: 8px;
      }

      .info-card {
        padding: 12px 8px;
      }

      .info-value {
        font-size: 20px;
      }

      .top-ranking {
        grid-template-columns: 1fr;
      }

      .rank-card.first {
        grid-column: auto;
      }

      .rank-image,
      .rank-card.first .rank-image {
        height: 230px;
      }

      .lower-item {
        grid-template-columns: 38px 44px minmax(0, 1fr);
      }

      .lower-image {
        width: 44px;
        height: 44px;
      }

      .lower-score {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="header-title">キャラクターランキング</h1>
    </header>

    <section id="setupArea" class="panel setup-panel">
      <h2 class="section-title">登場作品を選択</h2>
      <div class="game-actions">
        <button id="selectAllBtn" class="small-button">全選択</button>
        <button id="clearAllBtn" class="small-button">全解除</button>
      </div>

      <div id="gameList" class="game-list"></div>

      <div class="mode-section">
        <h2 class="section-title">比較方式</h2>
        <div class="mode-list">
          <div class="mode-item">
            <input type="radio" id="modeIndirect" name="compareMode" value="indirect" checked>
            <label for="modeIndirect" class="mode-label">
              <span class="mode-name">お手軽比較モード</span>
              <span class="mode-description">比較的すぐ終わります、とりあえずこちらから</span>
            </label>
          </div>

          <div class="mode-item">
            <input type="radio" id="modeRoundRobin" name="compareMode" value="roundrobin">
            <label for="modeRoundRobin" class="mode-label">
              <span class="mode-name">総当たりモード</span>
              <span class="mode-description">すべてのキャラを総当たりします。時間がすごくかかるよ</span>
            </label>
          </div>
        </div>
      </div>

      <div class="selection-info">
        <div class="info-card">
          <span class="info-label">選択作品</span>
          <span id="selectedGameCount" class="info-value">0</span>
        </div>
        <div class="info-card">
          <span class="info-label">対象キャラ</span>
          <span id="selectedCharacterCount" class="info-value">0</span>
        </div>
      </div>

      <div id="matchCount" class="match-count"></div>

      <button id="startButton" class="start-button" disabled>ランキング開始</button>
      <div id="setupError" class="error-message hidden"></div>
    </section>

    <section id="compareArea" class="panel compare-panel hidden">
      <div class="compare-header">
        <h2 id="compareTitle" class="compare-title">どちらが好き？</h2>
        <div id="progress" class="progress">1 / 1</div>
      </div>

      <div class="battle-area">
        <button id="leftBtn" class="character-button">
          <img id="leftImg" class="character-image" src="" alt="">
          <div id="leftName" class="character-name"></div>
        </button>

        <div class="vs">VS</div>

        <button id="rightBtn" class="character-button">
          <img id="rightImg" class="character-image" src="" alt="">
          <div id="rightName" class="character-name"></div>
        </button>
      </div>

      <div class="compare-footer">
        <button id="changeSelectionBtn" class="back-button">選択画面に戻る</button>
      </div>
    </section>

    <section id="resultArea" class="panel result-panel hidden">
      <div class="result-header">
        <h2 class="result-title">RANKING</h2>
        <p id="resultSubtitle" class="result-subtitle">ランキング結果</p>
      </div>

      <div id="topRanking" class="top-ranking"></div>

      <div id="lowerRanking" class="lower-ranking">
        <button id="lowerToggle" class="lower-toggle">
          <span>6位以降のランキングを表示</span>
          <span class="arrow">▼</span>
        </button>
        <div id="lowerList" class="lower-list"></div>
      </div>

      <div class="result-actions">
        <button id="restartButton" class="restart-button">もう一度遊ぶ</button>
      </div>
    </section>

    <section id="loadingArea" class="panel hidden">
      <div class="loading">
        <div class="spinner"></div>
        <div>キャラクターデータを読み込んでいます……</div>
      </div>
    </section>
  </div>

  <script>
    "use strict";

    const JSON_FILE = "rankingCharacters.json";
    const IMAGE_FOLDER = "FEimages/";
    const K = 32;

    /* 間接比較モードの設定 */
    const INDIRECT_INITIAL_MATCHES_PER_CHARACTER = 3;
    const INDIRECT_CLOSE_SCORE = 70;
    const INDIRECT_VERY_CLOSE_SCORE = 35;
    const INDIRECT_MAX_EXTRA_MATCHES = 2;

    let gameData = {};
    let charData = [];
    let score = {};
    let directWins = {};
    let directLosses = {};
    let directMatches = new Set();
    let inferredWins = {};
    let currentRound = 0;
    let totalRounds = 0;
    let compareMode = "indirect";

    const setupArea = document.getElementById("setupArea");
    const compareArea = document.getElementById("compareArea");
    const resultArea = document.getElementById("resultArea");
    const loadingArea = document.getElementById("loadingArea");

    const gameList = document.getElementById("gameList");
    const selectedGameCount = document.getElementById("selectedGameCount");
    const selectedCharacterCount = document.getElementById("selectedCharacterCount");
    const matchCount = document.getElementById("matchCount");
    const startButton = document.getElementById("startButton");
    const selectAllBtn = document.getElementById("selectAllBtn");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const setupError = document.getElementById("setupError");

    const compareTitle = document.getElementById("compareTitle");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const leftImg = document.getElementById("leftImg");
    const rightImg = document.getElementById("rightImg");
    const leftName = document.getElementById("leftName");
    const rightName = document.getElementById("rightName");
    const progress = document.getElementById("progress");
    const changeSelectionBtn = document.getElementById("changeSelectionBtn");

    const topRanking = document.getElementById("topRanking");
    const lowerRanking = document.getElementById("lowerRanking");
    const lowerToggle = document.getElementById("lowerToggle");
    const lowerList = document.getElementById("lowerList");
    const restartButton = document.getElementById("restartButton");
    const resultSubtitle = document.getElementById("resultSubtitle");

    loadCharacters();

    async function loadCharacters() {
      setupArea.classList.add("hidden");
      loadingArea.classList.remove("hidden");

      try {
        const response = await fetch(JSON_FILE);

        if (!response.ok) {
          throw new Error("JSONファイルの読み込みに失敗しました。");
        }

        gameData = await response.json();
        validateGameData();
        createGameCheckboxes();
        updateSelectionInfo();

        loadingArea.classList.add("hidden");
        setupArea.classList.remove("hidden");
      } catch (error) {
        loadingArea.classList.add("hidden");
        setupArea.classList.remove("hidden");

        showError("キャラクターデータを読み込めませんでした。rankingCharacters.jsonがranking.htmlと同じフォルダにあるか確認してください。");
      }
    }

    function validateGameData() {
      if (typeof gameData !== "object" || gameData === null || Array.isArray(gameData)) {
        throw new Error("JSONの形式が正しくありません。");
      }

      for (const [game, characters] of Object.entries(gameData)) {
        if (!Array.isArray(characters)) {
          throw new Error(`${game}のデータが配列になっていません。`);
        }

        for (const name of characters) {
          if (typeof name !== "string" || name.trim() === "") {
            throw new Error(`${game}に不正なキャラクター名があります。`);
          }
        }
      }
    }

    function createGameCheckboxes() {
      gameList.innerHTML = "";

      Object.keys(gameData).forEach((game, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "game-item";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.id = `game-${index}`;
        input.value = game;
        input.addEventListener("change", updateSelectionInfo);

        const label = document.createElement("label");
        label.className = "game-label";
        label.htmlFor = input.id;

        const check = document.createElement("span");
        check.className = "custom-check";

        const name = document.createElement("span");
        name.className = "game-name";
        name.textContent = game;

        label.appendChild(check);
        label.appendChild(name);
        wrapper.appendChild(input);
        wrapper.appendChild(label);
        gameList.appendChild(wrapper);
      });
    }

    function getSelectedGames() {
      return [...gameList.querySelectorAll('input[type="checkbox"]:checked')]
        .map(input => input.value);
    }

    function getSelectedCharacters() {
      const selectedGames = getSelectedGames();
      const uniqueCharacters = new Map();

      for (const game of selectedGames) {
        for (const name of gameData[game]) {
          const characterName = name.trim();

          if (!uniqueCharacters.has(characterName)) {
            uniqueCharacters.set(characterName, {
              id: characterName,
              name: characterName,
              img: IMAGE_FOLDER + characterName + ".png"
            });
          }
        }
      }

      return [...uniqueCharacters.values()];
    }

    function updateSelectionInfo() {
      const games = getSelectedGames();
      const characters = getSelectedCharacters();

      selectedGameCount.textContent = games.length;
      selectedCharacterCount.textContent = characters.length;

      const mode = document.querySelector('input[name="compareMode"]:checked')?.value || "indirect";
      compareMode = mode;

      if (characters.length < 2) {
        matchCount.textContent = "";
      } else if (mode === "roundrobin") {
        const matches = characters.length * (characters.length - 1) / 2;
        matchCount.textContent = `総当たりの場合：${matches}試合`;
      } else {
        const matches = characters.length * INDIRECT_INITIAL_MATCHES_PER_CHARACTER / 2;
        matchCount.textContent = `基本約${Math.ceil(matches)}試合＋スコアが近いキャラの追加比較`;
      }

      startButton.disabled = characters.length < 2;
    }

    document.querySelectorAll('input[name="compareMode"]').forEach(input => {
      input.addEventListener("change", updateSelectionInfo);
    });

    selectAllBtn.addEventListener("click", () => {
      gameList.querySelectorAll('input[type="checkbox"]').forEach(input => {
        input.checked = true;
      });

      updateSelectionInfo();
    });

    clearAllBtn.addEventListener("click", () => {
      gameList.querySelectorAll('input[type="checkbox"]').forEach(input => {
        input.checked = false;
      });

      updateSelectionInfo();
    });

    startButton.addEventListener("click", startRanking);

    function startRanking() {
      charData = getSelectedCharacters();

      if (charData.length < 2) {
        showError("ランキングには2人以上のキャラクターが必要です。");
        return;
      }

      compareMode = document.querySelector('input[name="compareMode"]:checked').value;

      setupError.classList.add("hidden");
      initializeRanking();

      setupArea.classList.add("hidden");
      resultArea.classList.add("hidden");
      compareArea.classList.remove("hidden");

      nextMatch();
    }

    function initializeRanking() {
      score = {};
      directWins = {};
      directLosses = {};
      directMatches = new Set();
      inferredWins = {};
      currentRound = 0;

      charData.forEach(character => {
        score[character.id] = 1000;
        directWins[character.id] = [];
        directLosses[character.id] = [];
        inferredWins[character.id] = [];
      });

      if (compareMode === "roundrobin") {
        totalRounds = charData.length * (charData.length - 1) / 2;
      } else {
        totalRounds = Math.ceil(charData.length * INDIRECT_INITIAL_MATCHES_PER_CHARACTER / 2);
      }

      compareTitle.textContent =
        compareMode === "roundrobin"
          ? "どちらが好き？"
          : "どちらが好き？";
    }

    function getPairKey(a, b) {
      return [a, b].sort().join("\u0000");
    }

    function hasDirectMatch(a, b) {
      return directMatches.has(getPairKey(a, b));
    }

    function addDirectResult(winner, loser) {
      const expected = 1 / (1 + 10 ** ((score[loser] - score[winner]) / 400));

      score[winner] += K * (1 - expected);
      score[loser] += K * (0 - expected);

      if (!directWins[winner].includes(loser)) {
        directWins[winner].push(loser);
      }

      if (!directLosses[loser].includes(winner)) {
        directLosses[loser].push(winner);
      }

      directMatches.add(getPairKey(winner, loser));

      updateInferredResults();
    }

    function updateInferredResults() {
      charData.forEach(character => {
        inferredWins[character.id] = [];
      });

      for (const character of charData) {
        const start = character.id;
        const visited = new Set([start]);
        const queue = [...directWins[start]];

        while (queue.length > 0) {
          const current = queue.shift();

          if (visited.has(current)) {
            continue;
          }

          visited.add(current);
          inferredWins[start].push(current);

          for (const next of directWins[current]) {
            if (!visited.has(next)) {
              queue.push(next);
            }
          }
        }
      }
    }

    function chooseRoundRobinPair() {
      const candidates = [];

      for (let i = 0; i < charData.length; i++) {
        for (let j = i + 1; j < charData.length; j++) {
          const a = charData[i].id;
          const b = charData[j].id;

          if (!hasDirectMatch(a, b)) {
            candidates.push([charData[i], charData[j]]);
          }
        }
      }

      if (candidates.length === 0) {
        return null;
      }

      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function chooseIndirectPair() {
      const candidates = [];

      for (let i = 0; i < charData.length; i++) {
        for (let j = i + 1; j < charData.length; j++) {
          const a = charData[i];
          const b = charData[j];

          if (hasDirectMatch(a.id, b.id)) {
            continue;
          }

          const difference = Math.abs(score[a.id] - score[b.id]);

          candidates.push({
            a: a,
            b: b,
            difference: difference
          });
        }
      }

      if (candidates.length === 0) {
        return null;
      }

      candidates.sort((a, b) => a.difference - b.difference);

      const veryClose = candidates.filter(
        pair => pair.difference <= INDIRECT_VERY_CLOSE_SCORE
      );

      if (veryClose.length > 0) {
        return randomFrom(veryClose.slice(0, 8));
      }

      const close = candidates.filter(
        pair => pair.difference <= INDIRECT_CLOSE_SCORE
      );

      if (close.length > 0) {
        return randomFrom(close.slice(0, 10));
      }

      return randomFrom(candidates.slice(0, 10));
    }

    function randomFrom(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function nextMatch() {
      let pair = null;

      if (compareMode === "roundrobin") {
        pair = chooseRoundRobinPair();
      } else {
        pair = chooseIndirectPair();
      }

      if (!pair) {
        finish();
        return;
      }

      const [left, right] = pair;

      leftName.textContent = left.name;
      rightName.textContent = right.name;

      setCharacterImage(leftImg, left);
      setCharacterImage(rightImg, right);

      leftBtn.onclick = () => vote(left.id, right.id);
      rightBtn.onclick = () => vote(right.id, left.id);

      progress.textContent = `${currentRound + 1} / ${getProgressTotal()}`;
    }

    function getProgressTotal() {
      if (compareMode === "roundrobin") {
        return charData.length * (charData.length - 1) / 2;
      }

      return "?";
    }

    function vote(winner, loser) {
      addDirectResult(winner, loser);
      currentRound++;

      if (compareMode === "roundrobin") {
        nextMatch();
        return;
      }

      if (shouldFinishIndirect()) {
        finish();
        return;
      }

      nextMatch();
    }

    function shouldFinishIndirect() {
      const remainingPairs = [];

      for (let i = 0; i < charData.length; i++) {
        for (let j = i + 1; j < charData.length; j++) {
          const a = charData[i].id;
          const b = charData[j].id;

          if (!hasDirectMatch(a, b)) {
            remainingPairs.push([a, b]);
          }
        }
      }

      if (remainingPairs.length === 0) {
        return true;
      }

      const targetRounds = Math.max(
        charData.length,
        Math.ceil(charData.length * INDIRECT_INITIAL_MATCHES_PER_CHARACTER / 2)
      );

      if (currentRound < targetRounds) {
        return false;
      }

      const closePairs = remainingPairs.filter(([a, b]) => {
        const difference = Math.abs(score[a] - score[b]);
        return difference <= INDIRECT_CLOSE_SCORE;
      });

      if (closePairs.length === 0) {
        return true;
      }

      const extraRounds = currentRound - targetRounds;

      return extraRounds >= INDIRECT_MAX_EXTRA_MATCHES * charData.length;
    }

    function finish() {
      compareArea.classList.add("hidden");
      resultArea.classList.remove("hidden");

      const ranking = Object.entries(score)
        .map(([id, value]) => {
          const character = charData.find(item => item.id === id);

          return {
            id: id,
            name: character.name,
            img: character.img,
            score: value
          };
        })
        .sort((a, b) => b.score - a.score);

      resultSubtitle.textContent =
        `${charData.length}キャラ・${currentRound}試合`;

      renderTopRanking(ranking.slice(0, 5));
      renderLowerRanking(ranking.slice(5));

      lowerRanking.classList.remove("open");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function renderTopRanking(ranking) {
      topRanking.innerHTML = "";

      ranking.forEach((character, index) => {
        const card = document.createElement("div");
        card.className = "rank-card";

        if (index === 0) {
          card.classList.add("first");
        } else if (index === 1) {
          card.classList.add("second");
        } else if (index === 2) {
          card.classList.add("third");
        }

        const rank = document.createElement("div");
        rank.className = "rank-number";
        rank.textContent = getRankLabel(index + 1);

        const img = document.createElement("img");
        img.className = "rank-image";
        img.alt = character.name;
        setImageSource(img, character);

        const name = document.createElement("div");
        name.className = "rank-name";
        name.textContent = character.name;

        const scoreElement = document.createElement("div");
        scoreElement.className = "rank-score";
        scoreElement.textContent = `スコア ${character.score.toFixed(0)}`;

        card.appendChild(rank);
        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(scoreElement);

        topRanking.appendChild(card);
      });
    }

    function renderLowerRanking(ranking) {
      lowerList.innerHTML = "";

      if (ranking.length === 0) {
        lowerRanking.classList.add("hidden");
        return;
      }

      lowerRanking.classList.remove("hidden");

      ranking.forEach((character, index) => {
        const item = document.createElement("div");
        item.className = "lower-item";

        const rank = document.createElement("div");
        rank.className = "lower-rank";
        rank.textContent = `${index + 6}位`;

        const img = document.createElement("img");
        img.className = "lower-image";
        img.alt = character.name;
        setImageSource(img, character);

        const name = document.createElement("div");
        name.className = "lower-name";
        name.textContent = character.name;

        const scoreElement = document.createElement("div");
        scoreElement.className = "lower-score";
        scoreElement.textContent = character.score.toFixed(0);

        item.appendChild(rank);
        item.appendChild(img);
        item.appendChild(name);
        item.appendChild(scoreElement);

        lowerList.appendChild(item);
      });
    }

    function setCharacterImage(img, character) {
      img.alt = character.name;
      setImageSource(img, character);
    }

    function setImageSource(img, character) {
      img.src = character.img;

      img.onerror = () => {
        img.onerror = null;
        img.src = createPlaceholder(character.name);
      };
    }

    function getRankLabel(rank) {
      if (rank === 1) {
        return "?? 1位";
      }

      if (rank === 2) {
        return "?? 2位";
      }

      if (rank === 3) {
        return "?? 3位";
      }

      return `${rank}位`;
    }

    lowerToggle.addEventListener("click", () => {
      lowerRanking.classList.toggle("open");
    });

    changeSelectionBtn.addEventListener("click", () => {
      compareArea.classList.add("hidden");
      resultArea.classList.add("hidden");
      setupArea.classList.remove("hidden");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    restartButton.addEventListener("click", () => {
      resultArea.classList.add("hidden");
      setupArea.classList.remove("hidden");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    function showError(message) {
      setupError.innerHTML = message;
      setupError.classList.remove("hidden");
    }

    function createPlaceholder(name) {
      const safeName = escapeHtml(name);
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
          <rect width="400" height="500" fill="#f8fafc"/>
          <text x="200" y="240" text-anchor="middle" font-size="28" fill="#9ca3af" font-family="sans-serif">${safeName}</text>
          <text x="200" y="280" text-anchor="middle" font-size="16" fill="#cbd5e1" font-family="sans-serif">画像なし</text>
        </svg>
      `;

      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
